name: Build multi-platform plugin candidates

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-candidates.yml'
      - 'shared/release/**'
      - 'ssh/**'
      - 'ldap/**'
      - 'files/**'
      - 'kafka/**'
  pull_request:
    paths:
      - '.github/workflows/build-candidates.yml'
      - 'shared/release/**'
      - 'ssh/**'
      - 'ldap/**'
      - 'files/**'
      - 'kafka/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugin-candidates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PLUGIN_CLI_VERSION: '0.1.3'

jobs:
  build:
    name: ${{ matrix.plugin }} / ${{ matrix.target }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { plugin: ssh,   directory: ssh,   runner: macos-15,       target: darwin-arm64 }
          - { plugin: ssh,   directory: ssh,   runner: macos-15-intel, target: darwin-x64 }
          - { plugin: ssh,   directory: ssh,   runner: windows-2022,   target: windows-x64 }
          - { plugin: ssh,   directory: ssh,   runner: ubuntu-24.04,   target: linux-x64 }
          - { plugin: ssh,   directory: ssh,   runner: ubuntu-24.04-arm, target: linux-arm64 }
          - { plugin: ldap,  directory: ldap,  runner: macos-15,       target: darwin-arm64 }
          - { plugin: ldap,  directory: ldap,  runner: macos-15-intel, target: darwin-x64 }
          - { plugin: ldap,  directory: ldap,  runner: windows-2022,   target: windows-x64 }
          - { plugin: ldap,  directory: ldap,  runner: ubuntu-24.04,   target: linux-x64 }
          - { plugin: ldap,  directory: ldap,  runner: ubuntu-24.04-arm, target: linux-arm64 }
          - { plugin: files, directory: files, runner: macos-15,       target: darwin-arm64 }
          - { plugin: files, directory: files, runner: macos-15-intel, target: darwin-x64 }
          - { plugin: files, directory: files, runner: windows-2022,   target: windows-x64 }
          - { plugin: files, directory: files, runner: ubuntu-24.04,   target: linux-x64 }
          - { plugin: files, directory: files, runner: ubuntu-24.04-arm, target: linux-arm64 }
          - { plugin: kafka, directory: kafka, runner: macos-15,       target: darwin-arm64 }
          - { plugin: kafka, directory: kafka, runner: macos-15-intel, target: darwin-x64 }
          - { plugin: kafka, directory: kafka, runner: windows-2022,   target: windows-x64 }
          - { plugin: kafka, directory: kafka, runner: ubuntu-24.04,   target: linux-x64 }
          - { plugin: kafka, directory: kafka, runner: ubuntu-24.04-arm, target: linux-arm64 }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Expose host SDK for Go sidecars
        shell: bash
        run: cp -a host ../dbx-plugin-host-worktree

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev nasm
          # The plugin CLI invokes a bare `cargo build` while packaging. Route it
          # through cargo-zigbuild so Linux sidecars link against a low glibc
          # baseline: the official docker image runtime is debian:bookworm-slim
          # (glibc 2.36), and a native ubuntu-24.04 build pins GLIBC_2.38/2.39,
          # which kills the sidecar in the loader (exit status 1) — seen as
          # "Plugin initialization failed" on web/docker installs
          # (dbx-plugin-ssh#8, dbx-plugin-ssh#58).
          pip3 install --user --break-system-packages ziglang
          cargo install --locked cargo-zigbuild
          # Go sidecars (ldap/kafka) must link statically: the CLI's internal
          # `go build` inherits this env, and a cgo build pins GLIBC_2.34+,
          # coupling the binary to the build host's glibc. deploy/web already
          # packages them with CGO_ENABLED=0; keep release candidates identical.
          echo "CGO_ENABLED=0" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.cargo/wrappers"
          CARGO_BIN="$(command -v cargo)"
          cat > "$HOME/.cargo/wrappers/cargo" <<'WRAPPER'
          #!/bin/sh
          # Route the packaging CLI's bare `cargo build` through cargo-zigbuild so
          # Linux sidecars link against zig's low glibc baseline. An explicit
          # host --target is REQUIRED: without it cargo-zigbuild delegates to the
          # distro toolchain and the baseline follows the runner (glibc 2.39 on
          # ubuntu-24.04, which kills the sidecar in the official bookworm
          # docker image). zigbuild puts output under <triple>/release/ while the
          # CLI copies from <CARGO_TARGET_DIR>/release/, so mirror top-level
          # artifacts back. Any non-build cargo call passes through untouched.
          if [ "$1" != "build" ]; then
            exec __CARGO__ "$@"
          fi
          shift
          TRIPLE="$(rustc -vV | sed -n 's/^host: //p')"
          __CARGO__ zigbuild --target "$TRIPLE" "$@" || exit $?
          if [ -n "${CARGO_TARGET_DIR:-}" ] && [ -d "$CARGO_TARGET_DIR/$TRIPLE/release" ]; then
            mkdir -p "$CARGO_TARGET_DIR/release"
            find "$CARGO_TARGET_DIR/$TRIPLE/release" -maxdepth 1 -type f \
              -exec cp -a {} "$CARGO_TARGET_DIR/release/" \;
          fi
          WRAPPER
          sed -i "s|__CARGO__|$CARGO_BIN|" "$HOME/.cargo/wrappers/cargo"
          chmod +x "$HOME/.cargo/wrappers/cargo"
          echo "$HOME/.cargo/wrappers" >> "$GITHUB_PATH"

      - name: Install Windows native dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install nasm -y --no-progress

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        run: npm install --global pnpm@11.24.0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install DBX plugin CLI
        run: npm install --global "@dbx-app/plugin-cli@${PLUGIN_CLI_VERSION}"

      - name: Validate manifest
        run: python shared/release/validate_manifests.py "${{ matrix.directory }}"

      - name: Build frontend, sidecar, and unsigned candidate
        working-directory: ${{ matrix.directory }}
        env:
          DBX_PLUGIN_TARGET: ${{ matrix.target }}
        run: bash scripts/build.sh

      - name: Upload candidate
        uses: actions/upload-artifact@v4
        with:
          name: dbx-plugin-${{ matrix.plugin }}-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ matrix.directory }}/dist/*.dbxp
            ${{ matrix.directory }}/dist/*.artifact.json

  verify:
    name: Verify candidate set
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download all candidates
        uses: actions/download-artifact@v4
        with:
          pattern: dbx-plugin-*
          path: candidate-artifacts
          merge-multiple: true

      - name: Verify hashes, sizes, identity, and target coverage
        run: python3 shared/release/validate_artifact_set.py candidate-artifacts

      - name: Publish combined candidate bundle
        uses: actions/upload-artifact@v4
        with:
          name: dbx-plugin-candidates-${{ github.sha }}
          path: candidate-artifacts
          if-no-files-found: error
          retention-days: 14
