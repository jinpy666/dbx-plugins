name: Build multi-platform plugin candidates

on:
  push:
    branches: [master, main]
    paths:
      - '.github/workflows/build-candidates.yml'
      - 'shared/release/**'
      - 'ssh/**'
      - 'ldap/**'
      - 'files/**'
      - 'kafka/**'
  pull_request:
    paths:
      - '.github/workflows/build-candidates.yml'
      - 'shared/release/**'
      - 'ssh/**'
      - 'ldap/**'
      - 'files/**'
      - 'kafka/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugin-candidates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PLUGIN_CLI_VERSION: '0.1.3'

jobs:
  build:
    name: ${{ matrix.plugin }} / ${{ matrix.target }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { plugin: ssh,   directory: ssh,   runner: macos-15,       target: darwin-arm64 }
          - { plugin: ssh,   directory: ssh,   runner: macos-15-intel, target: darwin-x64 }
          - { plugin: ssh,   directory: ssh,   runner: windows-2022,   target: windows-x64 }
          - { plugin: ssh,   directory: ssh,   runner: ubuntu-24.04,   target: linux-x64 }
          - { plugin: ssh,   directory: ssh,   runner: ubuntu-24.04-arm, target: linux-arm64 }
          - { plugin: ldap,  directory: ldap,  runner: macos-15,       target: darwin-arm64 }
          - { plugin: ldap,  directory: ldap,  runner: macos-15-intel, target: darwin-x64 }
          - { plugin: ldap,  directory: ldap,  runner: windows-2022,   target: windows-x64 }
          - { plugin: ldap,  directory: ldap,  runner: ubuntu-24.04,   target: linux-x64 }
          - { plugin: ldap,  directory: ldap,  runner: ubuntu-24.04-arm, target: linux-arm64 }
          - { plugin: files, directory: files, runner: macos-15,       target: darwin-arm64 }
          - { plugin: files, directory: files, runner: macos-15-intel, target: darwin-x64 }
          - { plugin: files, directory: files, runner: windows-2022,   target: windows-x64 }
          - { plugin: files, directory: files, runner: ubuntu-24.04,   target: linux-x64 }
          - { plugin: files, directory: files, runner: ubuntu-24.04-arm, target: linux-arm64 }
          - { plugin: kafka, directory: kafka, runner: macos-15,       target: darwin-arm64 }
          - { plugin: kafka, directory: kafka, runner: macos-15-intel, target: darwin-x64 }
          - { plugin: kafka, directory: kafka, runner: windows-2022,   target: windows-x64 }
          - { plugin: kafka, directory: kafka, runner: ubuntu-24.04,   target: linux-x64 }
          - { plugin: kafka, directory: kafka, runner: ubuntu-24.04-arm, target: linux-arm64 }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        run: npm install --global pnpm@11.24.0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install DBX plugin CLI
        run: npm install --global "@dbx-app/plugin-cli@${PLUGIN_CLI_VERSION}"

      - name: Validate manifest
        run: python shared/release/validate_manifests.py "${{ matrix.directory }}"

      - name: Build frontend, sidecar, and unsigned candidate
        working-directory: ${{ matrix.directory }}
        env:
          DBX_PLUGIN_TARGET: ${{ matrix.target }}
        run: bash scripts/build.sh

      - name: Upload candidate
        uses: actions/upload-artifact@v4
        with:
          name: dbx-plugin-${{ matrix.plugin }}-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ matrix.directory }}/dist/*.dbxp
            ${{ matrix.directory }}/dist/*.artifact.json

  verify:
    name: Verify candidate set
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download all candidates
        uses: actions/download-artifact@v4
        with:
          pattern: dbx-plugin-*
          path: candidate-artifacts
          merge-multiple: true

      - name: Verify hashes, sizes, identity, and target coverage
        run: python3 shared/release/validate_artifact_set.py candidate-artifacts

      - name: Publish combined candidate bundle
        uses: actions/upload-artifact@v4
        with:
          name: dbx-plugin-candidates-${{ github.sha }}
          path: candidate-artifacts
          if-no-files-found: error
          retention-days: 14
