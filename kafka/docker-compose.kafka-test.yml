# Local Apache Kafka (KRaft, single node) container for scripts/smoke_container.py
# (scenarios S1-S10). PLAINTEXT only: there are no credentials in this setup, so
# no secret environment variable is required; if a SASL/TLS variant is added
# later, every secret must come from the environment via ${VAR:?export VAR ...}.
services:
  kafka-test:
    image: apache/kafka:latest
    container_name: dbx-kafka-test
    ports:
      - "9092:9092"
    environment:
      # --- KRaft single-node (official apache/kafka image variable group) ---
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://127.0.0.1:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      # --- single-broker internals ---
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
